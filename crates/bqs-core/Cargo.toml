[package]
name = "bqs-core"
version.workspace = true
edition.workspace = true
description = "banqi-scheduler 领域内核：ports（端口 trait）+ 各独立持锁子系统 + gRPC 契约编排门面"

[dependencies]
bqs-proto = { workspace = true }
bqs-config = { workspace = true }
bqs-judgment = { workspace = true }
bq-env = { workspace = true }
bq-policy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = []
# test-util：对下游 crate（bqs-store / bqs-storage）的测试开放共享 test_support
# （FakeClock 等），替代各 crate 各持一份 FixedClock
test-util = []
