
syntax = "proto3";

package scheduler;

option go_package = "banqi/server/pb";

// 对局记录与标签包契约：单一真源在 banqi-core/proto/game_record.proto，
// GameRecord / GameLabelPack / DataKind 等类型从该文件引入（bqrecord 包）。
import "game_record.proto";

message TaskRequest {
  string worker_id = 1;
  string client_version = 2;
  int32 threads = 3;
  int64 memory_mb = 4;
  string current_network = 5;
}

message GenerationSpec {
  string variant = 1;
  reserved 2; // 曾为 OpeningScenario 枚举；场景改为 scenario_json 透传后废弃
  optional uint64 seed = 3;
  bqrecord.DataKind data_kind = 4;
  uint64 games = 5;
  uint64 deadline_unix = 6;
  // 收集器成对并行：true = 按“对”为单位并行执行（默认），
  // false = 逐局独立执行（对内两局不再绑定同一种子语义由 pair_seed_refresh 决定）。
  optional bool pairs_parallel = 7;
  // 对内第二局是否刷新种子：true = 第二局换用派生新种子（默认，自对弈收集无需同种子），
  // false = 第二局与第一局同种子、仅交换先后手（rating 类对打用于方差缩减）。
  optional bool pair_seed_refresh = 8;
  oneof behavior {
    Plays plays = 10;
    DeriveFeatures derive = 12;
  }
  // 字段号 11 曾为 reanalysis 行为（重搜链路已移除），勿复用。
  // 指定 BFEN 起始局面（rating 链路下发通道；collect 链路经 CollectionJobSpec 内嵌透传）。
  // 非空时对局从这些局面开始、按对局序号取模循环选取；覆盖 scenario/initial_revealed。
  repeated string start_fens = 13;
  // 开局场景透传：banqi-core OpeningScenario 的 serde JSON
  // （如 {"kind":"random_reveals","count":3}）；空串 = standard。
  // banqi-core 新增场景时只需透传 JSON，本契约与 collector 无需改动。
  string scenario_json = 14;
}

message Plays {
  CollectPlayerSpec player_a = 1;
  CollectPlayerSpec player_b = 2;
}

message DeriveFeatures {
  string episode_object_key = 1;
  string episode_url = 2;
}

message TaskResponse {
  string task_id = 1;
  string variant = 2;
  string network_sha = 3;
  string opponent_sha = 4;
  string network_url = 5;
  string opponent_url = 6;
  string network_sha_remote = 7;
  SelfPlayParams params = 9;
  string message = 10;
  string network_key = 11;
  string opponent_key = 12;
  GenerationSpec generation = 22;
  reserved 8, 13, 14, 15, 16, 17, 18, 19, 20, 21;
}

enum TaskKind {
  TASK_NONE = 0;
  TASK_SELFPLAY = 1;
  TASK_RATING = 2;
  reserved 3, 4;
  TASK_DERIVE_FEATURES = 5;
  TASK_COLLECT = 6;
}

message SelfPlayParams {
  int32 mcts_sims = 1;
  string extra_config = 5;
  // 任务级探索参数（与 CollectSearchParams 同构）。调度器创建任务时必填下发，
  // worker 以此为唯一来源构建搜索配置，本地不再保留任何默认值。
  CollectSearchParams search = 7;
  reserved 2, 3, 4, 6;
}

message EpisodeMeta {
  string worker_id = 1;
  string task_id = 2;
  int32 game_count = 3;
  int32 total_steps = 4;
  int32 winner = 5;
  string network_sha = 6;
  int64 timestamp = 7;
  int64 content_length = 8;
  string content_sha256 = 9;
  bqrecord.DataKind kind = 10;
  int32 red_wins = 11;
  int32 black_wins = 12;
  int32 draw_no_capture = 13;
  int32 draw_truncation = 14;
  // 任务下发的基础种子（GenerationSpec.seed；未下发时缺省）
  optional uint64 seed_base = 15;
  // 与任务一致的配对语义快照（便于前端核对实际执行配置）
  optional bool pairs_parallel = 16;
  optional bool pair_seed_refresh = 17;
  // 逐局标识摘要（对局反查的索引来源）
  repeated bqrecord.GameSummary games = 18;
  // 标签包对象（.lab.v1.lpb.gz）三元组：任一缺失表示标签包未上传成功
  string label_object_key = 19;
  int64 label_content_length = 20;
  string label_content_sha256 = 21;
}

message EpisodeAck {
  bool accepted = 1;
  string message = 2;
  string upload_url = 3;
  string object_key = 4;
  // 标签包预签名 PUT：一次 RPC 返回记录与标签包两个上传地址（原子成对上报）
  string label_upload_url = 5;
  string label_object_key = 6;
}

// 离线训练数据浏览（外部脚本/Python 离线训练消费）
message ListEpisodesRequest {
  int32 limit = 1;
  string after_key = 2;
  optional bqrecord.DataKind kind = 3;
}

message EpisodeObject {
  string object_key = 1;
  string download_url = 2;
  int64 size = 3;
  // 标签包对象（可能为空：import 来源的 episode 或标签包未成功上传）
  string label_object_key = 4;
  string label_download_url = 5;
  int64 label_size = 6;
}

message ListEpisodesReply {
  repeated EpisodeObject objects = 1;
  bool has_more = 2;
}

message RegisterNetworkRequest {
  string sha = 1;
  string parent_sha = 2;
  string upload_url = 3;
  string notes = 4;
  string format = 5;
  reserved 6;
}

message RegisterNetworkAck {
  bool accepted = 1;
  string message = 2;
  string match_task_hint = 3;
}

message MatchResult {
  string worker_id = 1;
  string task_id = 2;
  reserved 3;
  string network_sha = 4;
  string opponent_sha = 5;
  int32 games = 6;
  int32 wins = 7;
  int32 losses = 8;
  int32 draws = 9;
  int32 pair_ll = 10;
  int32 pair_ld = 11;
  int32 pair_dd = 12;
  int32 pair_wl = 21;
  int32 pair_dw = 13;
  int32 pair_ww = 14;
  reserved 15;
  float avg_moves = 16;
  int32 red_wins = 17;
  int32 black_wins = 18;
  int32 draw_no_capture = 19;
  int32 draw_truncation = 20;
}

message MatchResultAck {
  bool accepted = 1;
  string message = 2;
  bool match_concluded = 3;
  reserved 4, 5; // 旧 promoted / best_sha（best 语义已移除）
}

message HeartbeatRequest {
  string worker_id = 1;
  int32 current_threads = 2;
  int32 completed_games = 3;
  string running_task_id = 4;
  string client_version = 5;
  int64 memory_mb = 6;
  string health_status = 7;
  string last_error = 8;
}

message HeartbeatReply {
  bool pause_self_play = 1;
  reserved 2;
  float temperature = 3;
  bool playout_cap_random = 4;
  reserved 5; // 旧 best_network（best 语义已移除）
  repeated string cancel_task_ids = 6;
}

message GetInfoRequest {}

message VariantMeta {
  string id = 1;
  string label = 2;
  uint32 rows = 3;
  uint32 cols = 4;
  repeated uint32 piece_counts = 5;
  repeated int32 piece_values = 6;
  int32 initial_health = 7;
  uint32 max_consecutive_moves_for_draw = 8;
  repeated string symmetries = 9;
}

message GetInfoReply {
  string variant = 1;
  VariantMeta variant_meta = 4;
  bool should_stop = 2;
  string stop_reason = 3;
}

// EpisodeBatch / FeaturePack / NnueMeta / NnueFeatures / ResNetFeatures / GameSummary
// 已迁至 game_record.proto（package bqrecord）——数据面契约（记录批 / 标签包 / 特征包 /
// 逐局摘要）统一由 bqrecord 提供；本文件只保留控制面（任务派发 / RPC 信封 / 调度域）。
// EpisodeBatch 更名为 bqrecord.GameRecordBatch。

message FeaturePackMeta {
  string worker_id = 1;
  string task_id = 2;
  string episode_object_key = 3;
  uint32 pack_version = 4;
  int64 content_length = 5;
  string content_sha256 = 6;
}

message FeaturePackAck {
  bool accepted = 1;
  string message = 2;
  string upload_url = 3;
  string object_key = 4;
}

message FeaturePackRequest {
  string requester = 1;
  string episode_object_key = 2;
  uint32 pack_version = 3;
}

message FeaturePackReply {
  bool accepted = 1;
  string message = 2;
  bool ready = 3;
  string object_key = 4;
  string download_url = 5;
}

enum JobKind {
  JOB_COLLECT = 0;
  JOB_SELFPLAY = 1;
  reserved 2;
  JOB_RATING = 3;
}

enum SeedStrategyKind {
  SEED_FIXED = 0;
  SEED_RANDOM = 1;
  SEED_INCREMENTAL = 2;
  SEED_RANGE = 3;
}

message SeedStrategy {
  SeedStrategyKind kind = 1;
  uint64 fixed_seed = 2;
  uint64 base_seed = 3;
  uint64 min_seed = 4;
  uint64 max_seed = 5;
}

message CollectPlayerSpec {
  string kind = 1;
  string network_sha = 2;
  CollectSearchParams search = 3;
}

message CollectSearchParams {
  uint32 mcts_sims = 1;
  uint32 mcts_max_considered_actions = 2;
  double mcts_c_scale = 3;
  double mcts_gumbel_scale = 4;
  float temperature = 5;
  bool playout_cap_random = 6;
  uint64 expectimax_node_budget = 7;
  uint32 expectimax_max_depth = 8;
  // 字段号 9/10 曾为标注器参数（labeler 概念已移除），勿复用。
  reserved 9, 10;
  bool expl_enabled = 11;
  uint32 expl_topk = 12;
  double expl_temp_start = 13;
  double expl_temp_end = 14;
  uint32 expl_temp_decay_steps = 15;
  // Fast/Full Search 混合（算力分配随机化）；fast = 0 表示由 mcts_sims 派生
  uint32 fast_mcts_sims = 16;
  double full_search_prob = 17;
  // SHA 淘汰率因子 eta（每阶段保留 1/eta 候选）
  uint32 mcts_eta = 18;
  // SHA 淘汰判据置信系数（0 = 点估计）
  double mcts_ucb_c = 19;
  // 机会节点共同随机数
  bool mcts_crn_enabled = 20;
  // 血量差异头复合效用 U = Q_win + λ·Q_hp
  bool health_enabled = 21;
  double health_weight = 22;
  double health_confidence_exp = 23;
  // Expectimax 探索采样模式：gumbel（默认）| softmax
  string expl_mode = 24;
  // Expectimax 根层全窗口搜索（root_values 完整分布，供探索采样/policy 标签；根层剪枝收益归零、显著变慢）
  bool expectimax_root_fullwidth = 25;
  // 机会节点前瞻深度 k（Chance.outcome_depth）：0 = k=0 现语义；optional 表达 presence，
  // 必传由调度器组装保证（collector 收到 None 时显式报错 fail fast）。
  optional int32 expectimax_chance_outcome_depth = 26;
  // 机会子树预算占 node_budget 的比例（Chance 预算隔离）：0-1，仅 k>=1 时生效；
  // optional 表达 presence，必传由调度器组装保证（collector 收到 None 时显式报错 fail fast）。
  optional float expectimax_chance_budget_ratio = 27;
}

message CollectionJobSpec {
  string variant = 1;
  reserved 2; // 曾为 OpeningScenario 枚举；场景改为 scenario_json 透传后废弃
  SeedStrategy seed_strategy = 3;
  CollectPlayerSpec player_a = 4;
  CollectPlayerSpec player_b = 5;
  bqrecord.DataKind data_kind = 6;
  uint64 total_games = 7;
  // 任务级覆写：成对并行开关（缺省 = 调度器默认 true）
  optional bool pairs_parallel = 8;
  // 任务级覆写：对内第二局是否刷新种子（缺省 = 调度器默认 true；rating 类保持同种子传 false）
  optional bool pair_seed_refresh = 9;
  // 指定 BFEN 起始局面：非空时对局从这些局面开始、按对局序号取模循环选取；
  // 覆盖 scenario/initial_revealed。空 = 完全走既有路径。
  repeated string start_fens = 10;
  // 开局场景透传：banqi-core OpeningScenario 的 serde JSON（空串 = standard）
  string scenario_json = 11;
}

message SelfPlayJobSpec {
  string variant = 1;
  bqrecord.DataKind data_kind = 2;
  string network_sha = 3;
  string opponent_sha = 4;
  double mix_ratio = 5;
  CollectSearchParams search = 6;
  uint64 total_games = 7;
}

message RatingJobSpec {
  string variant = 1;
  string candidate_sha = 2;
  string opponent_sha = 3;
  uint64 total_games = 4;
  double sprt_elo0 = 5;
  double sprt_elo1 = 6;
  double sprt_alpha = 7;
  double sprt_beta = 8;
  CollectPlayerSpec side_a = 9;
  CollectPlayerSpec side_b = 10;
  // 指定 BFEN 起始局面：非空时对局从这些局面开始、按对局序号取模循环选取；覆盖 scenario。
  repeated string start_fens = 11;
  reserved 12; // 曾为 OpeningScenario 枚举；场景改为 scenario_json 透传后废弃
  // 开局场景透传：banqi-core OpeningScenario 的 serde JSON（空串 = standard）
  string scenario_json = 13;
  // 禁用 SPRT 提前判定：true 时按 total_games 跑满后以 "cap" 结论收尾（默认 false = 启用 SPRT）
  bool disable_sprt = 14;
}

message SubmitJobRequest {
  string requester = 1;
  JobKind kind = 2;
  uint32 priority = 3;
  CollectionJobSpec collect = 4;
  SelfPlayJobSpec selfplay = 5;
  reserved 6;
  RatingJobSpec rating = 7;
}
message SubmitJobReply {
  bool accepted = 1;
  string message = 2;
  string job_id = 3;
}

message JobStatus {
  string job_id = 1;
  JobKind kind = 2;
  uint32 priority = 3;
  string state = 4;
  uint64 total_games = 5;
  uint64 completed_games = 6;
  uint64 dispatched_games = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  CollectionJobSpec collect = 10;
  SelfPlayJobSpec selfplay = 11;
  reserved 12;
  RatingJobSpec rating = 13;
}

message ListJobsRequest {
  string state_filter = 1;
  optional JobKind kind_filter = 2;
  // 精确 job_id 查询（非空时仅返回该 job）
  string job_id = 3;
  // 单页上限；<= 0 表示不分页（全量返回）
  int64 limit = 4;
  // 跳过条数（与 limit 配合实现分页）
  int64 offset = 5;
}
message ListJobsReply {
  repeated JobStatus jobs = 1;
  // 满足过滤条件的总条数（不受 limit/offset 影响）
  int64 total = 2;
}

message JobControlRequest {
  string job_id = 1;
  string control = 2;
}
message JobControlReply {
  bool accepted = 1;
  string message = 2;
  string state = 3;
}

service SchedulerService {
  rpc GetInfo (GetInfoRequest) returns (GetInfoReply);
  rpc GetTask (TaskRequest) returns (TaskResponse);
  rpc ReportEpisode (EpisodeMeta) returns (EpisodeAck);
  rpc ListEpisodes (ListEpisodesRequest) returns (ListEpisodesReply);
  rpc RegisterNetwork (RegisterNetworkRequest) returns (RegisterNetworkAck);
  rpc ReportMatchResult (MatchResult) returns (MatchResultAck);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);
  rpc ReportFeaturePack (FeaturePackMeta) returns (FeaturePackAck);
  rpc RequestFeaturePack (FeaturePackRequest) returns (FeaturePackReply);
  rpc SubmitJob (SubmitJobRequest) returns (SubmitJobReply);
  rpc ListJobs (ListJobsRequest) returns (ListJobsReply);
  rpc ControlJob (JobControlRequest) returns (JobControlReply);
}
