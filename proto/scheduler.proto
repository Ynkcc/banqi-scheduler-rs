
syntax = "proto3";

package scheduler;

option go_package = "banqi/server/pb";

message TaskRequest {
  string worker_id = 1;
  string client_version = 2;
  int32 threads = 3;
  int64 memory_mb = 4;
  string current_network = 5;
}

message GenerationSpec {
  string variant = 1;
  OpeningScenario scenario = 2;
  optional uint64 seed = 3;
  DataKind data_kind = 4;
  uint64 games = 5;
  uint64 deadline_unix = 6;
  // 收集器成对并行：true = 按“对”为单位并行执行（默认），
  // false = 逐局独立执行（对内两局不再绑定同一种子语义由 pair_seed_refresh 决定）。
  optional bool pairs_parallel = 7;
  // 对内第二局是否刷新种子：true = 第二局换用派生新种子（默认，自对弈收集无需同种子），
  // false = 第二局与第一局同种子、仅交换先后手（rating 类对打用于方差缩减）。
  optional bool pair_seed_refresh = 8;
  oneof behavior {
    Plays plays = 10;
    Reanalysis reanalysis = 11;
    DeriveFeatures derive = 12;
  }
  // 指定 BFEN 起始局面（rating 链路下发通道；collect 链路经 CollectionJobSpec 内嵌透传）。
  // 非空时对局从这些局面开始、按对局序号取模循环选取；覆盖 scenario/initial_revealed。
  repeated string start_fens = 13;
}

message Plays {
  CollectPlayerSpec player_a = 1;
  CollectPlayerSpec player_b = 2;
}

message Reanalysis {
  bytes payload = 1;
}

message DeriveFeatures {
  string episode_object_key = 1;
  string episode_url = 2;
}

message TaskResponse {
  string task_id = 1;
  string variant = 2;
  string network_sha = 3;
  string opponent_sha = 4;
  string network_url = 5;
  string opponent_url = 6;
  string network_sha_remote = 7;
  SelfPlayParams params = 9;
  string message = 10;
  string network_key = 11;
  string opponent_key = 12;
  GenerationSpec generation = 22;
  reserved 8, 13, 14, 15, 16, 17, 18, 19, 20, 21;
}

enum TaskKind {
  TASK_NONE = 0;
  TASK_SELFPLAY = 1;
  TASK_RATING = 2;
  TASK_REANALYSIS = 3;
  reserved 4;
  TASK_DERIVE_FEATURES = 5;
  TASK_COLLECT = 6;
}

enum DataKind {
  DATA_RESNET = 0;
  DATA_NNUE = 1;
  DATA_NONE = 2;
}

message SelfPlayParams {
  int32 mcts_sims = 1;
  string extra_config = 5;
  // 任务级探索参数（与 CollectSearchParams 同构）。调度器创建任务时必填下发，
  // worker 以此为唯一来源构建搜索配置，本地不再保留任何默认值。
  CollectSearchParams search = 7;
  reserved 2, 3, 4, 6;
}

message EpisodeMeta {
  string worker_id = 1;
  string task_id = 2;
  int32 game_count = 3;
  int32 total_steps = 4;
  int32 winner = 5;
  string network_sha = 6;
  int64 timestamp = 7;
  int64 content_length = 8;
  string content_sha256 = 9;
  DataKind kind = 10;
  int32 red_wins = 11;
  int32 black_wins = 12;
  int32 draw_no_capture = 13;
  int32 draw_truncation = 14;
}

message EpisodeAck {
  bool accepted = 1;
  string message = 2;
  string upload_url = 3;
  string object_key = 4;
}

message NetworkRequest {
  string sha = 1;
}

message NetworkInfo {
  string sha = 1;
  string download_url = 2;
  int64 created_at = 3;
  bool is_best = 4;
  string game_data = 5;
  string key = 6;
}

message RegisterNetworkRequest {
  string sha = 1;
  string parent_sha = 2;
  string upload_url = 3;
  string notes = 4;
  string format = 5;
  // 单次上报覆盖：true = 本次仅登记网络，不创建 gatekeeper 对打任务
  //（不设置时回退到调度器 [gatekeeper] auto_match 配置）
  optional bool skip_match = 6;
}

message RegisterNetworkAck {
  bool accepted = 1;
  string message = 2;
  string match_task_hint = 3;
}

message MatchResult {
  string worker_id = 1;
  string task_id = 2;
  reserved 3;
  string network_sha = 4;
  string opponent_sha = 5;
  int32 games = 6;
  int32 wins = 7;
  int32 losses = 8;
  int32 draws = 9;
  int32 pair_ll = 10;
  int32 pair_ld = 11;
  int32 pair_dd = 12;
  int32 pair_wl = 21;
  int32 pair_dw = 13;
  int32 pair_ww = 14;
  reserved 15;
  float avg_moves = 16;
  int32 red_wins = 17;
  int32 black_wins = 18;
  int32 draw_no_capture = 19;
  int32 draw_truncation = 20;
}

message MatchResultAck {
  bool accepted = 1;
  string message = 2;
  bool match_concluded = 3;
  bool promoted = 4;
  string best_sha = 5;
}

message HeartbeatRequest {
  string worker_id = 1;
  int32 current_threads = 2;
  int32 completed_games = 3;
  string running_task_id = 4;
  string client_version = 5;
  int64 memory_mb = 6;
  string health_status = 7;
  string last_error = 8;
}

message HeartbeatReply {
  bool pause_self_play = 1;
  reserved 2;
  float temperature = 3;
  bool playout_cap_random = 4;
  string best_network = 5;
  repeated string cancel_task_ids = 6;
}

message SignNetworkUploadRequest {
  string trainer_id = 1;
  string sha = 2;
  int64 content_length = 3;
  string content_sha256 = 4;
  string format = 5;
}

message SignNetworkUploadAck {
  bool accepted = 1;
  string message = 2;
  string upload_url = 3;
  string object_key = 4;
}

message ListEpisodesRequest {
  int32 limit = 1;
  string after_key = 2;
  optional DataKind kind = 3;
}

message EpisodeObject {
  string object_key = 1;
  string download_url = 2;
  int64 size = 3;
}

message ListEpisodesReply {
  repeated EpisodeObject objects = 1;
  bool has_more = 2;
}

message SubmitReanalysisRequest {
  string requester = 1;
  string variant = 2;
  int32 mcts_sims = 3;
  uint32 positions = 4;
  bytes payload = 5;
}

message SubmitReanalysisReply {
  bool accepted = 1;
  string message = 2;
  uint64 queued_positions = 3;
}

message GetInfoRequest {}

message VariantMeta {
  string id = 1;
  string label = 2;
  uint32 rows = 3;
  uint32 cols = 4;
  repeated uint32 piece_counts = 5;
  repeated int32 piece_values = 6;
  int32 initial_health = 7;
  uint32 max_consecutive_moves_for_draw = 8;
  repeated string symmetries = 9;
}

message GetInfoReply {
  string variant = 1;
  VariantMeta variant_meta = 4;
  bool should_stop = 2;
  string stop_reason = 3;
}

message TrainerHeartbeatRequest {
  string trainer_id = 1;
  string variant = 2;
  DataKind kind = 3;
  string consumed_key = 4;
  int64 samples_consumed = 5;
  int32 backlog = 6;
  int32 buffered = 7;
  string health_status = 8;
  string last_error = 9;
  string progress_json = 10;
}

message TrainerHeartbeatReply {
  bool pause_self_play = 1;
  bool auto_paused = 2;
  string auto_pause_reason = 3;
  string message = 4;
}

message GetTrainConfigRequest {
  string variant = 1;
  string trainer_id = 2;
}

message GetTrainConfigReply {
  bool accepted = 1;
  string message = 2;
  map<string, string> overrides = 3;
}

message EpisodeBatch {
  uint32 schema_version = 1;
  string variant = 2;
  DataKind kind = 5;
  repeated GameRecord records = 3;
  reserved 4;
}

message GameRecord {
  uint32 steps = 1;

  optional uint64 game_seed = 2;
  bytes initial_layout = 3;
  bytes players = 4;
  bytes actions = 5;
  repeated bytes snapshots = 6;
  optional int32 winner = 7;
  uint32 termination_reason = 8;
  optional float terminal_margin = 9;
  optional float health_diff_red = 10;

  repeated uint64 producer_hashes = 11;
  bytes producers = 12;
  uint32 search_config_version = 13;

  bytes value_labels = 14;
  bytes own_values = 15;
  bytes root_visits = 16;
  bytes is_full_search = 17;

  bytes policies = 18;
  bytes labeler_actions = 19;
  bytes labeler_policy_actions = 20;
  bytes labeler_policy_values = 21;
  bytes labeler_policy_offsets = 22;
  bytes labeler_fallbacks = 23;

  bytes search_depths = 24;
  bytes search_nodes = 25;
  bytes hidden_counts = 26;
  bytes chosen_value_gaps = 27;
  bytes expl_random = 28;
}

message NnueMeta {
  uint32 feature_dim = 1;
  uint32 states_per_square = 2;
  uint32 bag_stride = 3;
  uint32 num_active = 4;
  uint32 total_positions = 5;
  uint32 threat_buckets = 6;
}

message NnueFeatures {
  NnueMeta meta = 1;
  bytes indices = 2;
  bytes offsets = 3;
}

message ResNetFeatures {
  uint32 board_channels = 1;
  uint32 board_rows = 2;
  uint32 board_cols = 3;
  uint32 scalar_count = 4;
  uint32 action_space = 5;
  bytes boards_bits = 6;
  bytes scalars = 7;
  bytes action_masks_bits = 8;
}

message FeaturePack {
  uint32 pack_version = 1;
  string variant = 2;
  DataKind kind = 3;
  uint32 steps = 4;
  bytes record_sha256 = 5;
  NnueFeatures nnue = 6;
  ResNetFeatures resnet = 7;
}

message FeaturePackMeta {
  string worker_id = 1;
  string task_id = 2;
  string episode_object_key = 3;
  uint32 pack_version = 4;
  int64 content_length = 5;
  string content_sha256 = 6;
}

message FeaturePackAck {
  bool accepted = 1;
  string message = 2;
  string upload_url = 3;
  string object_key = 4;
}

message FeaturePackRequest {
  string requester = 1;
  string episode_object_key = 2;
  uint32 pack_version = 3;
}

message FeaturePackReply {
  bool accepted = 1;
  string message = 2;
  bool ready = 3;
  string object_key = 4;
  string download_url = 5;
}

enum JobKind {
  JOB_COLLECT = 0;
  JOB_SELFPLAY = 1;
  reserved 2;
  JOB_RATING = 3;
}

enum OpeningScenario {
  SCENARIO_STANDARD = 0;
  SCENARIO_ALL_REVEALED = 1;
}

enum SeedStrategyKind {
  SEED_FIXED = 0;
  SEED_RANDOM = 1;
  SEED_INCREMENTAL = 2;
  SEED_RANGE = 3;
}

message SeedStrategy {
  SeedStrategyKind kind = 1;
  uint64 fixed_seed = 2;
  uint64 base_seed = 3;
  uint64 min_seed = 4;
  uint64 max_seed = 5;
}

message CollectPlayerSpec {
  string kind = 1;
  string network_sha = 2;
  CollectSearchParams search = 3;
}

message CollectSearchParams {
  uint32 mcts_sims = 1;
  uint32 mcts_max_considered_actions = 2;
  double mcts_c_scale = 3;
  double mcts_gumbel_scale = 4;
  float temperature = 5;
  bool playout_cap_random = 6;
  uint64 expectimax_node_budget = 7;
  uint32 expectimax_max_depth = 8;
  string labeler_mode = 9;
  uint32 labeler_budget_mult = 10;
  bool expl_enabled = 11;
  uint32 expl_topk = 12;
  double expl_temp_start = 13;
  double expl_temp_end = 14;
  uint32 expl_temp_decay_steps = 15;
  // Fast/Full Search 混合（算力分配随机化）；fast = 0 表示由 mcts_sims 派生
  uint32 fast_mcts_sims = 16;
  double full_search_prob = 17;
  // SHA 淘汰率因子 eta（每阶段保留 1/eta 候选）
  uint32 mcts_eta = 18;
  // SHA 淘汰判据置信系数（0 = 点估计）
  double mcts_ucb_c = 19;
  // 机会节点共同随机数
  bool mcts_crn_enabled = 20;
  // 血量差异头复合效用 U = Q_win + λ·Q_hp
  bool health_enabled = 21;
  double health_weight = 22;
  double health_confidence_exp = 23;
}

message CollectionJobSpec {
  string variant = 1;
  OpeningScenario scenario = 2;
  SeedStrategy seed_strategy = 3;
  CollectPlayerSpec player_a = 4;
  CollectPlayerSpec player_b = 5;
  DataKind data_kind = 6;
  uint64 total_games = 7;
  // 任务级覆写：成对并行开关（缺省 = 调度器默认 true）
  optional bool pairs_parallel = 8;
  // 任务级覆写：对内第二局是否刷新种子（缺省 = 调度器默认 true；rating 类保持同种子传 false）
  optional bool pair_seed_refresh = 9;
  // 指定 BFEN 起始局面：非空时对局从这些局面开始、按对局序号取模循环选取；
  // 覆盖 scenario/initial_revealed。空 = 完全走既有路径。
  repeated string start_fens = 10;
}

message SelfPlayJobSpec {
  string variant = 1;
  DataKind data_kind = 2;
  string network_sha = 3;
  string opponent_sha = 4;
  double mix_ratio = 5;
  CollectSearchParams search = 6;
  uint64 total_games = 7;
}

message RatingJobSpec {
  string variant = 1;
  string candidate_sha = 2;
  string opponent_sha = 3;
  uint64 total_games = 4;
  double sprt_elo0 = 5;
  double sprt_elo1 = 6;
  double sprt_alpha = 7;
  double sprt_beta = 8;
  CollectPlayerSpec side_a = 9;
  CollectPlayerSpec side_b = 10;
  // 指定 BFEN 起始局面：非空时对局从这些局面开始、按对局序号取模循环选取；覆盖 scenario。
  repeated string start_fens = 11;
  // 开局场景（SCENARIO_STANDARD / SCENARIO_ALL_REVEALED）；start_fens 非空时被覆盖。
  OpeningScenario scenario = 12;
}

message SubmitJobRequest {
  string requester = 1;
  JobKind kind = 2;
  uint32 priority = 3;
  CollectionJobSpec collect = 4;
  SelfPlayJobSpec selfplay = 5;
  reserved 6;
  RatingJobSpec rating = 7;
}
message SubmitJobReply {
  bool accepted = 1;
  string message = 2;
  string job_id = 3;
}

message JobStatus {
  string job_id = 1;
  JobKind kind = 2;
  uint32 priority = 3;
  string state = 4;
  uint64 total_games = 5;
  uint64 completed_games = 6;
  uint64 dispatched_games = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  CollectionJobSpec collect = 10;
  SelfPlayJobSpec selfplay = 11;
  reserved 12;
  RatingJobSpec rating = 13;
}

message ListJobsRequest {
  string state_filter = 1;
  optional JobKind kind_filter = 2;
  // 精确 job_id 查询（非空时仅返回该 job）
  string job_id = 3;
  // 单页上限；<= 0 表示不分页（全量返回）
  int64 limit = 4;
  // 跳过条数（与 limit 配合实现分页）
  int64 offset = 5;
}
message ListJobsReply {
  repeated JobStatus jobs = 1;
  // 满足过滤条件的总条数（不受 limit/offset 影响）
  int64 total = 2;
}

message JobControlRequest {
  string job_id = 1;
  string control = 2;
}
message JobControlReply {
  bool accepted = 1;
  string message = 2;
  string state = 3;
}

service SchedulerService {
  rpc GetInfo (GetInfoRequest) returns (GetInfoReply);
  rpc GetTask (TaskRequest) returns (TaskResponse);
  rpc ReportEpisode (EpisodeMeta) returns (EpisodeAck);
  rpc GetNetwork (NetworkRequest) returns (NetworkInfo);
  rpc RegisterNetwork (RegisterNetworkRequest) returns (RegisterNetworkAck);
  rpc ReportMatchResult (MatchResult) returns (MatchResultAck);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);
  rpc SignNetworkUpload (SignNetworkUploadRequest) returns (SignNetworkUploadAck);
  rpc ListEpisodes (ListEpisodesRequest) returns (ListEpisodesReply);
  rpc SubmitReanalysis (SubmitReanalysisRequest) returns (SubmitReanalysisReply);
  rpc GetTrainConfig (GetTrainConfigRequest) returns (GetTrainConfigReply);
  rpc TrainerHeartbeat (TrainerHeartbeatRequest) returns (TrainerHeartbeatReply);
  rpc ReportFeaturePack (FeaturePackMeta) returns (FeaturePackAck);
  rpc RequestFeaturePack (FeaturePackRequest) returns (FeaturePackReply);
  rpc SubmitJob (SubmitJobRequest) returns (SubmitJobReply);
  rpc ListJobs (ListJobsRequest) returns (ListJobsReply);
  rpc ControlJob (JobControlRequest) returns (JobControlReply);
}
