# configs/config.example.conf — Rust 调度器示例配置（[section] + key = value，TOML 风格）
#
# 用法：
#   cp configs/config.example.conf configs/config.conf   # 按需修改，config.conf 不要提交
#
# 命令行参数（--listen / --db / --http-addr / --bucket）优先于对应键。
# 提示：db.path 建议放 data/ 目录下（该目录不提交，gitignore 已覆盖）

# ── 监听与元数据 ────────────────────────────────────────────────────────────
[server]
# gRPC 监听地址（须与采集端一致）
listen = ":50051"
# WebUI 监听地址；WebUI 启动失败只记日志，不影响 gRPC 调度（无鉴权，勿暴露公网）
http_addr = "127.0.0.1:9536"
# worker 在线判定窗口（秒）：最后心跳距今超过该值显示为离线
worker_online_seconds = 60
# WebUI 前端静态资源目录（SPA 构建产物，含 index.html）；空 = 不托管前端（仅 JSON API）
#webui_dist = "webui/dist"

# ── SQLite 数据库（networks / matches / episodes / workers） ─────────────────
[db]
path = "data/scheduler.db"

# ── S3 兼容存储（Cloudflare R2 / MinIO / RustFS 等；首次启动引导配置） ────────
# 存储后端配置在调度器侧独占管理（worker 零凭据，只跟随预签名 URL）。本段仅在
# 首次启动时迁移为名为 default 的存储 profile（落 SQLite settings 表），之后请到
# WebUI「存储」页增删改 profile、校验连通性并热切换后端。
[storage]
# 桶名（R2 控制台创建）
bucket = "banqi"
# 区域；R2 用 "auto"
region = "auto"
# S3 API 端点：账号限定域名，不带桶名路径
# （形如 https://<account_id>.r2.cloudflarestorage.com；本地 MinIO/RustFS 填 http://host:port）
endpoint = "https://<account_id>.r2.cloudflarestorage.com"
# R2 → API → 创建 API 令牌（权限：对象读和写）
access_key = ""
secret_key = ""
# MinIO/RustFS 等本地 S3 实现必须 true（virtual-host 无法解析）；R2 保持 false
path_style = false

# ── 任务默认参数 ────────────────────────────────────────────────────────────
# （原 selfplay 常驻任务已移除；本节保留变体、局数与课程学习等任务级默认值，
#   供 collect / rating job 派发时引用）
[selfplay]
# 下发给 worker 的变体 id（须在 banqi-core/bq-env 变体表中登记）
# 当前变体词表：4x8 / 4x8-fast / 4x4 / 4x2（与 banqi-core::Variant::as_str() 一致）
variant = "4x8"
# 每次下发的局数（也是 rating 任务单批上限）
games_per_task = 16
# 资源分配基准线程数：局数按 worker 上报线程数缩放（games = games_per_task × threads/基准，
# 最小 1）。0 = 不按资源缩放，每批固定 games_per_task
threads_baseline = 4
# 课程学习：初始预翻棋子数，经 extra_config 下发给 worker（collect 与 rating 均生效）。
# 0 = 不下发，用变体默认值；可在 WebUI 在线切换（在线切换的值落库后优先于本配置）
initial_revealed = 0
# 在训架构产哪类训练数据：
#   resnet = Gumbel MCTS 的稠密特征（mcts_resnet 栈，配 .onnx 权重）
#   nnue   = Expectimax 的稀疏特征（expectimax_nnue 栈，配 .nnue 权重）
# 可在 WebUI 在线切换（在线切换的值落库后优先于本配置）
data_kind = "nnue"

# ── 探索参数默认值（随任务下发，worker 端不留本地默认值）──────────────────────
# 全系统唯一的探索参数默认来源：创建任务时填充 CollectSearchParams 下发，
# job 提交方可按玩家覆盖（CollectPlayerSpec.search），未覆盖字段以此为准。
[selfplay.search]
# 每次决策的 MCTS 模拟次数（mcts_resnet 栈）
mcts_sims = 64
# Gumbel Top-K 候选动作数
mcts_max_considered_actions = 16
# PUCT 探索系数与训练目标 σ 的缩放因子
mcts_c_scale = 1.0
# Gumbel 噪声尺度
mcts_gumbel_scale = 1.0
# 算力分配随机化（Fast/Full Search 混合）
playout_cap_random = false
# Fast Search 模拟次数；0 = 由 mcts_sims 派生（mcts_sims / 4）
fast_mcts_sims = 0
# Full Search 出现概率
full_search_prob = 0.25
# SHA 淘汰率因子 eta（每阶段保留 1/eta 的候选，≥2）
mcts_eta = 2
# SHA 淘汰判据置信系数 c（>0 启用乐观上界 UCB，0 = 点估计）
mcts_ucb_c = 0.0
# 机会节点共同随机数（CRN）
mcts_crn_enabled = false
# 血量差异头参与 MCTS 搜索（复合效用 U = Q_win + λ·Q_hp）
health_enabled = false
health_weight = 0.0
health_confidence_exp = 0.0
# expectimax_nnue 栈：节点预算 / 最大深度
expectimax_node_budget = 500000
expectimax_max_depth = 8
# 策略探索（采样式行动选择）：expl_mode = gumbel（默认，AlphaZero 风格 top-k）| softmax（温度退火）
expl_enabled = false
expl_topk = 8
expl_mode = "gumbel"
# Expectimax 根层全窗口搜索（root_values 完整分布；根层剪枝收益归零、显著变慢）
expectimax_root_fullwidth = false
expl_temp_start = 1.0
expl_temp_end = 0.15
expl_temp_decay_steps = 48

# 注：SPRT 判停参数无全局默认——rating job 提交时必须显式携带
# sprtElo0/sprtElo1/sprtAlpha/sprtBeta（缺失或越界将被拒绝）

# ── 统一 Job 机制：采集 job 派发参数 + 默认优先级（SubmitJob priority=0 时按 kind 回落）
[jobs]
# 采集 job（JOB_COLLECT）单任务局数额度；0 = 回落 selfplay.games_per_task
collect_games_per_task = 0
# 采集任务超期期限（秒；0 = 内置默认 1800——采集对打含搜索更慢）
collect_deadline_seconds = 1800
# 同一 worker 在同一采集 job 上的在飞任务上限（默认 2；0 = 不限）：
# worker 执行任务期间不轮询。
# 慢/掉线设备的任务超过 collect_deadline_seconds 超期后预算自动释放，由其他设备重派（对冲）
collect_max_inflight_per_worker = 2
# 超目标分发余量（局；默认 0 = 自动 = 单任务局数额度；负数 = 关闭超发）：
# 允许 completed+inflight 短暂超出 total_games 以填满空闲 worker；
# 高优先级竞争者出现时超额在飞任务被抢占取消，job 达成 total 后超额任务也被取消，浪费有界
collect_overdispatch_games = 0
# 默认优先级：collect=50 / rating=80（越大越先派发；
# 更高优先级 job 变为可派发时立即取消更低优先级 job 的在飞任务）
priority_collect = 50
priority_rating = 80
