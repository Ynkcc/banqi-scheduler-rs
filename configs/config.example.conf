# configs/config.example.conf — Go 调度器示例配置（[section] + key = value，TOML 风格）
#
# 用法：
#   cp configs/config.example.conf configs/config.conf   # 按需修改，config.conf 不要提交
#   make run        # 等价于 ./bin/scheduler -config configs/config.conf
#
# 或直接启动：scheduler -config /etc/banqi/scheduler.conf
# 命令行 flag（-listen / -db / -http-addr / -bucket）优先于对应键。
# 提示：db.path 建议放 data/ 目录下（该目录不提交，gitignore 已覆盖）

# ── 监听与元数据 ────────────────────────────────────────────────────────────
[server]
# gRPC 监听地址（须与采集端/训练端一致）
listen = ":50051"
# WebUI 监听地址；WebUI 启动失败只记日志，不影响 gRPC 调度（无鉴权，勿暴露公网）
http_addr = "127.0.0.1:9536"
# worker 在线判定窗口（秒）：最后心跳距今超过该值显示为离线
worker_online_seconds = 60
# 版本管控：client_version 低于该值的 worker 收到 task_waiting 不派单（空 = 不限制）
#min_client_version = "0.1.0"
# WebUI 前端静态资源目录（SPA 构建产物，含 index.html）；空 = 不托管前端（仅 JSON API）
#webui_dist = "webui/dist"

# ── SQLite 数据库（networks / matches / episodes / workers） ─────────────────
[db]
path = "data/scheduler.db"

# ── S3 兼容存储（Cloudflare R2 / MinIO / RustFS 等；首次启动引导配置） ────────
# 存储后端配置在调度器侧独占管理（worker 零凭据，只跟随预签名 URL）。本段仅在
# 首次启动时迁移为名为 default 的存储 profile（落 SQLite settings 表），之后请到
# WebUI「存储」页增删改 profile、校验连通性并热切换后端——改配置文件不再影响已
# 落库的配置。切换前先用 rclone sync 等工具同步历史对象到目标后端。
[storage]
# 桶名（R2 控制台创建）
bucket = "banqi"
# 区域；R2 用 "auto"
region = "auto"
# S3 API 端点：账号限定域名，不带桶名路径
# （形如 https://<account_id>.r2.cloudflarestorage.com；本地 MinIO/RustFS 填 http://host:port）
endpoint = "https://<account_id>.r2.cloudflarestorage.com"
# R2 → API → 创建 API 令牌（权限：对象读和写）
access_key = ""
secret_key = ""
# MinIO/RustFS 等本地 S3 实现必须 true（virtual-host 无法解析）；R2 保持 false
path_style = false

# ── 自对弈任务 ──────────────────────────────────────────────────────────────
[selfplay]
# 下发给 worker/trainer 的变体 id（须在 internal/scheduler/variants.json 中登记，
# 该文件由 banqi-core `cargo run -p banqi-core --bin variants_meta` 生成）
# 当前变体词表：4x8 / 4x8-fast / 4x4 / 4x2（与 banqi-core::Variant::as_str() 一致）
variant = "4x8"
# selfplay 每次下发的局数（也是 rating 任务单批上限）
games_per_task = 16
# 资源分配基准线程数：局数按 worker 上报线程数缩放（games = games_per_task × threads/基准，
# 最小 1）。0 = 不按资源缩放，每批固定 games_per_task
threads_baseline = 4
# gatekeeper 混入比例（0~1）：存在待判定候选网络时，selfplay 批内与上代 champion
# 换色对打的局数占比。混入对局同时产出候选侧训练数据与 GSPRT 五项计数，攒够自动
# 判停晋级 —— 不再独立派发 rating 对打任务；多个 worker 并发贡献计数，收敛更快。
# 0.25 ≈ 1/4 算力用于强度判定，其余保持纯自对弈吞吐（可走批量锁步）。
# 注意：需与 collector 同步升级 —— 旧 collector 收到混入任务会当作普通 selfplay 执行
# （不计入判定，数据仍有效）。
mix_ratio = 0.25
# 训练侧在训架构产哪类训练数据，经 SelfPlayParams.data_kind 下发：
#   resnet = Gumbel MCTS 自对弈的稠密特征（mcts_resnet 栈，配 .onnx 权重）
#   nnue   = Expectimax 强自对弈的稀疏特征（expectimax_nnue 栈，配 .nnue 权重）
# 该值代表「训练中网络」的架构；下发给 worker 时恒与产数据方权重格式配对——
# 纯自对弈若 best 架构不符（过渡期），自动改用该格式最新登记的网络产数据，
# 一张都没有则不下发任务；混入任务产数据方是候选，类别跟随候选格式。
# 可在 WebUI 在线切换（在线切换的值落库后优先于本配置）
data_kind = "resnet"
# 课程学习：初始预翻棋子数，经 extra_config 下发给 worker（selfplay 与 rating 均生效）。
# 0 = 不下发，用变体默认值；修改后重启调度器，或在 WebUI 在线切换（在线切换的值落库后优先于本配置）
initial_revealed = 0
# best 来源（蒸馏教师选择）。留空 = 按登记 best 网络下发（默认，正常自举闭环）。
# "rule" = 规则评估哨兵（Expectimax 搜索 + RuleMaterialEval 材料评估，单节点成本
# 约 1/3）：无混入对打时 GetTask 直接下发哨兵 selfplay 任务（network_sha="rule"，
# 无需在 R2 登记任何权重），worker 本地构造规则评估器产 NNUE 蒸馏数据。
# 用于冷启动：整个网络谱系尚不存在或不及规则基线时，由规则教师自标注蒸馏。
# 注意：仅支持 data_kind="nnue" 配合使用（哨兵任务强制按 nnue 下发）；
# 首个真实网络登记后仍直接晋级 best（门禁与混入不受本开关影响）。
# best = "rule"

# ── gatekeeper 门禁 ─────────────────────────────────────────────────────────
[gatekeeper]
# 对打目标局数（换色成对数；实际局数 = 值 × 2）
pairs = 400

# ── 五项 GSPRT 判停参数 ─────────────────────────────────────────────────────
[sprt]
# H0：新网络 <= elo0（拒绝晋级）；H1：新网络 >= elo1（晋级 best）
# 棘轮窄带（P1-29）：elo0=0 = 棘轮地板（不接受任何倒退）；elo1=15 对齐追平期
# 单代真实增益 +4~15——宽带 30 与单代增益结构性矛盾，每代都打满局数强制 reject。
elo0 = 0
elo1 = 15
# 两类错误率（越小判停所需局数越多）
alpha = 0.05
beta = 0.05

# ── 局面重搜 reanalysis（可选） ─────────────────────────────────────────────
# trainer 经 SubmitReanalysis 提交历史局面快照，由 worker 用当前 best 网络重跑 MCTS
# 刷新训练目标（数据走常规 episode 上报通道）。
# 重搜与自对弈争抢同一份算力，故按间隔节流：每 N 个 selfplay 任务最多下发 1 个重搜任务。
# 0 = 关闭（SubmitReanalysis 直接拒绝，队列不积累）。建议先设 4~8 观察吞吐影响。
[reanalysis]
interval_tasks = 0
# 待下发重搜任务的队列上限（按载荷条数）：满了拒绝新提交（不丢已有条目；
# 最旧的位置恰恰是重搜收益最大的，故不按 FIFO 丢弃）
max_queue = 64

# ── 生成-消费平衡（trainer 心跳 + 停滞自动暂停，可选） ────────────────────────
# 背景：trainer 意外停机、或有 bug 活着但根本不消费时，worker 仍会盲目生成 episode
# 堆积到 R2。本组配置让调度器据 trainer 心跳（TrainerHeartbeat RPC）感知消费健康度：
#   1. 离线：心跳超过 trainer_online_seconds 未到达；
#   2. 停摆：心跳在线但消费水位超过 stalled_seconds 无推进，且该类别还有已登记
#      未消费的批次（活着但有 bug 不消费）；
#   3. 积压：已登记未消费批数达到 backlog_pause_batches（可选，0 = 关闭）。
# 全部 trainer 均停滞才触发；只要还有一个 trainer 正常消费就不暂停。恢复后自动
# 解除（只解除自动暂停，人工暂停 pause_self_play 不受影响）。eval 评测任务恒不暂停。
# 依赖：trainer 须升级到支持 TrainerHeartbeat（旧 trainer 不发心跳 = 无观测数据，
# 不会触发任何动作）。
[balance]
# 是否启用（默认 false；建议先以 mode = "warn" 观测一段时间再切 pause）
enabled = false
# 停滞动作：warn = 只记日志与 WebUI 展示；pause = 自动暂停 selfplay 派发（含混入对打）
mode = "warn"
# 心跳离线判定窗口（秒）：应显著大于 trainer 心跳间隔（默认 30s），至少 30
trainer_online_seconds = 120
# 在线停摆判定窗口（秒）：消费水位停滞超过该值且仍有未消费批次即触发；须 >= trainer_online_seconds
stalled_seconds = 600
# 积压触发阈值（已登记未消费批数，0 = 关闭该触发器）：消费速度持续跟不上时触发
backlog_pause_batches = 0
# 自动暂停时是否一并暂停重搜（reanalysis）派发：重搜产物同样要经 trainer 消费
pause_reanalysis = false

# ── 绝对强度评估（TASK_EVAL，可选；建议开启） ────────────────────────────────
# 背景：gatekeeper（上面那组 GSPRT）是**相对**门禁，只回答「这代比上代强吗」，
# 结构上测不出「所有版本都打不过一个 3 行的优先吃子启发式」。本组配置让调度器按版本
# 自动下发「best vs 规则/内建对手」的评测任务（采集端执行、只统计胜负、不产训练数据、
# 不参与晋级），结果落 eval_results 并在 WebUI「绝对强度」页 / GET /api/eval 展示。
#
# ⚠️ 默认关闭：旧版 collector 不认识 TASK_EVAL（会安全降级为「无任务」并记日志），
#    请先升级 collector 再开启。当前 collector 已实现全部内建对手（含最强标尺）。
[eval]
enabled = true
# 对手阶梯（顺序即由弱到强展示）：random / rule:reveal_first / rule:capture_first /
# rule:material_expectimax。优先吃子必须在内 —— 它是「练了很久却打不过启发式」
# 这类问题的照妖镜；material_expectimax 是追平规则基线的核心标尺（P1-28），
# 其结果同时驱动 [eval] 的地板/回滚判据（见下）。
opponents = ["random", "rule:reveal_first", "rule:capture_first", "rule:material_expectimax"]
# 每档评估的目标局数（流式累加到目标即收尾聚合为一条结果）。1000 局纯策略约 6~13s；
# 定版建议 3000 局（SE≈0.9pt），趋势观察 1000 局（SE≈1.6pt）足够。
games = 1000
# 单任务局数额度（基准值）：>0 时评估按流式生产（与 selfplay 任务同构）——调度器持续
# 派发任务，多 worker 并发认领、上报增量累加，累计 ≥ games 即收尾。**实际单任务局数
# 与 selfplay 共用同一线程缩放算式**（games_per_task × worker 线程 / threads_baseline，
# 最小 1，快设备多打、慢设备少打、新设备随时分担），并按净剩余截断（不超额）。
# 0 = 单任务整包（一台 worker 承包全部局数，快设备完成后空等慢设备）。
games_per_task = 0
# 评估搜索深度：0 = 纯策略 argmax（无搜索，门禁主口径）；>0 = MCTS 模拟数（成本随其上升）
mcts_sims = 0
# 节流：每 N 次 best 晋级评测一次（1 = 每次都评测）
every_n_promotions = 1
# 停机判据：同一对手的胜率序列上，连续 N 次「提升 < no_progress_eps」即置位
# should_stop，trainer 轮询 GetInfo.should_stop 后优雅停止（先训完当前轮并落 checkpoint）。
# N=0 = 只观测不判停。
no_progress_n = 3
# 「有提升」的最小胜率增量：0.035 = 3.5pt（D5-P2-10 噪声折算：games=1000 时
# SE≈1.6pt、2σ≈3.2pt；旧值 2pt 只对齐 3000 局，存在把抽样噪声当停滞的误停机路径）
no_progress_eps = 0.035
# P1-29 地板/回滚：material_expectimax 评测落库后，若新 best 胜率比前任 best 低
# 超过 rollback_eps → best 指针回滚到前任、新网络标 rejected（相对门禁只保证
# 相邻两代不倒退，对绝对标尺的回退只有这里能拦）。floor_win_rate 为绝对地板
# （0 = 关闭；追平期谱系普遍低于 50%，先只观测，追平后建议设 0.5）。
rollback_eps = 0.04
floor_win_rate = 0.0
# 达标停机：material_expectimax 胜率 ≥ stop_win_rate 即置位 should_stop（trainer
# 轮询 GetInfo 后优雅停止：先训完当前轮并落 checkpoint）。与 no_progress_n（趋势
# 停滞）互补——本判据回答「练到目标强度就收」。0 = 关闭。
# WebUI「绝对强度」页可在线编辑对手阶梯与本阈值（落 settings，跨重启保留，
# 优先于本配置文件值）。
stop_win_rate = 0.0
